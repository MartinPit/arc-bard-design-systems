<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bard is a meticulous, expressive design system for composing calm and accessible digital experiences."
    />
    <meta name="theme-color" content="#e9f2e9" />
    <script>
      (function () {
        try {
          var theme = null;
          try {
            var saved = window.localStorage.getItem('bard-theme');
            if (saved === 'light' || saved === 'dark') theme = saved;
          } catch (_) {}
          if (!theme) {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0d1420' : '#e9f2e9');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <title>Bard — Design system</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bard/main.tsx"></script>
  </body>
</html>
